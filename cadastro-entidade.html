<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We Form</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
    <link
    rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="./assets/fontawesome-free-7.1.0-web/css/all.css">
</head>
<body>
    <div class="content">
        <aside>
            <img src="./assets/image 2.svg" alt="">
            <h1><span>We</span> Form</h1>
        </aside>

        <main>
            <header>
                <a href="index.html">
                    <i class="fa-solid fa-angle-left"></i>
                </a>
                <h2>Nova <span>entidade</span></h2>
            </header>

            <form action="">
                <label for="input-name">Nome</label>
                <input type="text" id="input-name">
                <label for="input-field">Campo de atuação</label>
                <div class="select-div">
                        <select type="text" id="input-field">
                            <option value="">Selecione uma opção</option>
                            <option value="abrigo">Abrigo de animais</option>
                            <option value="alimentacao">Centro de alimentação</option>
                            <option value="creche">Creche infantil</option>
                            <option value="doguinhos">Abrigo de cães</option>

                        </select>
                </div>   
            

                <div class="points">
                    <label for="input-points">Pontos de coleta</label>
                    <input type="text" id="input-points">
                    <button>
                        <i class="fa-solid fa-circle-plus"></i>
                    </button>
                </div>

            </form>

            <div class="actions">
                <a href="">Cadastrar</a>
            </div>
            

            
        </main>

    </div>


    <script src="js/script.js"></script>
</body>
</html>
